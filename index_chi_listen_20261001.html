<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>20隻熊貓森林大冒險</title>
    <!-- Include passages data file -->
    <script src="passages.js"></script>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background-color: #f0f7f4;
            color: #333;
            text-align: center;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .game-container {
            position: relative; /* Crucial for random absolute scattering */
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            padding: 25px;
            max-width: 680px;
            width: 100%;
            min-height: 550px;
            border: 4px solid #b4e197;
            box-sizing: border-box;
            overflow: hidden;
        }

        h1 {
            color: #5c8374;
            font-size: 22px;
            margin-bottom: 5px;
            position: relative;
            z-index: 10;
        }

        /* Randomly scattered pandas in the background */
        .scattered-panda {
            position: absolute;
            width: 35px;
            height: 35px;
            object-fit: contain;
            transition: all 0.4s ease;
            z-index: 1;
        }

        .stats-bar {
            font-size: 16px;
            font-weight: bold;
            margin: 5px 0 15px 0;
            color: #5c8374;
            position: relative;
            z-index: 10;
        }

        /* Target sentence assembly slots */
        #target-slots {
            display: flex;
            gap: 8px;
            justify-content: center;
            min-height: 65px;
            margin: 10px 0;
            background: #fffdf9;
            border: 3px dashed #d8e2dc;
            border-radius: 16px;
            padding: 8px;
            align-items: center;
            position: relative;
            z-index: 10;
        }

        .slot-box {
            width: 50px;
            height: 50px;
            background-color: #f0f7f4;
            border: 2px solid #b4e197;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: bold;
            color: #5c8374;
        }

        .slot-box.filled {
            background-color: #b5ead7;
            border-color: #90cdbc;
        }

        /* Scrambled word grid */
        #grid-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 15px auto;
            justify-content: center;
            position: relative;
            z-index: 10;
        }

        .grid-tile {
            background-color: #ffb7b2;
            color: white;
            font-size: 28px;
            font-weight: bold;
            height: 60px;
            width: 60px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px #ff9aa2;
            user-select: none;
        }

        .grid-tile:active {
            transform: translateY(2px);
        }

        .grid-tile.used {
            background-color: #e0e0e0 !important;
            box-shadow: 0 4px #ccc !important;
            color: #999;
            cursor: not-allowed;
            pointer-events: none;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 10px;
            position: relative;
            z-index: 10;
        }

        button {
            background-color: #ffb7b2;
            border: none;
            color: white;
            padding: 8px 18px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px #ff9aa2;
        }

        button:active {
            transform: translateY(2px);
        }

        button.secondary {
            background-color: #b5ead7;
            color: #333;
            box-shadow: 0 4px #c7ceea;
        }

        #feedback {
            font-size: 17px;
            font-weight: bold;
            height: 25px;
            margin-top: 5px;
            color: #ff9aa2;
            position: relative;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="game-container" id="game-box">
        <h1>🐼 20隻熊貓森林大冒險 🐼</h1>

        <!-- Layer where 20 organically scattered pandas will be randomly generated -->
        <div id="pandas-layer"></div>

        <div class="stats-bar">
            <div>⭐ 句子進度: <span id="score">0</span> / <span id="total-sentences">0</span></div>
            <div>❤️ 剩餘熊貓: <span id="lives">20</span></div>
        </div>

        <div id="feedback">載入中...</div>

        <!-- Sentence assembly slots -->
        <div id="target-slots"></div>

        <!-- Scrambled word grid -->
        <div id="grid-container"></div>

        <div class="btn-group">
            <button class="secondary" onclick="repeatSentence()">🔊 再聼一次句子</button>
            <button onclick="resetCurrentSentence()">🔄 重設此句</button>
        </div>
    </div>

    <script>
        let currentSentenceIndex = 0;
        let targetChars = [];
        let shuffledChars = [];
        let playerProgressIndex = 0;
        let lives = 20; // Total 20 pandas
        let gameActive = false;

        window.onload = function() {
            if (typeof gamePassages === 'undefined' || gamePassages.length === 0) {
                document.getElementById('feedback').innerText = '❌ passage.js 中找不到句子！';
                return;
            }
            document.getElementById('total-sentences').innerText = gamePassages.length;
            setupScatteredPandas();
            initGame();
        };

        // Organically scatter 20 pandas around the empty margins of the game card
        function setupScatteredPandas() {
            const layer = document.getElementById('pandas-layer');
            layer.innerHTML = '';

            // 20 organic coordinates mapping border/margin zones so they don't block center game UI
            const organicCoords = [
                { top: '15px', left: '12px' },  { top: '12px', left: '55px' },  { top: '18px', left: '110px' }, { top: '14px', right: '110px' }, { top: '12px', right: '55px' }, { top: '15px', right: '12px' },
                { top: '35%', left: '10px' },   { top: '50%', left: '12px' },   { top: '65%', left: '10px' },
                { top: '35%', right: '10px' },  { top: '50%', right: '12px' },  { top: '65%', right: '10px' },
                { bottom: '15px', left: '15px' }, { bottom: '18px', left: '60px' }, { bottom: '14px', left: '120px' },
                { bottom: '16px', right: '120px' }, { bottom: '12px', right: '60px' }, { bottom: '15px', right: '15px' },
                { top: '22%', left: '18px' },   { top: '22%', right: '18px' }
            ];

            organicCoords.forEach((pos, i) => {
                const img = document.createElement('img');
                img.src = 'panda.png';
                img.className = 'scattered-panda';
                img.id = `panda-${i}`;
                
                if (pos.top) img.style.top = pos.top;
                if (pos.bottom) img.style.bottom = pos.bottom;
                if (pos.left) img.style.left = pos.left;
                if (pos.right) img.style.right = pos.right;

                layer.appendChild(img);
            });
        }

        function initGame() {
            currentSentenceIndex = 0;
            lives = 20;
            updatePandas();
            loadSentence();
        }

        function updatePandas() {
            document.getElementById('lives').innerText = lives;
            // Wrong answers turn pandas into stone.png one by one from 19 down to 0
            for (let i = 0; i < 20; i++) {
                const pandaImg = document.getElementById(`panda-${i}`);
                if (pandaImg) {
                    if (i < lives) {
                        pandaImg.src = 'panda.png'; // Living panda
                    } else {
                        pandaImg.src = 'stone.png'; // Stone image
                    }
                }
            }
        }

        function loadSentence() {
            if (currentSentenceIndex >= gamePassages.length) {
                gameActive = false;
                document.getElementById('feedback').innerText = '🏆 太棒了！所有的熊貓都被拯救了！';
                speak('太棒了！所有的熊貓都被拯救了！');
                document.getElementById('target-slots').innerHTML = '';
                document.getElementById('grid-container').innerHTML = '';
                return;
            }

            gameActive = true;
            playerProgressIndex = 0;
            document.getElementById('score').innerText = currentSentenceIndex;

            const sentenceStr = gamePassages[currentSentenceIndex];
            targetChars = sentenceStr.split('');
            shuffledChars = [...targetChars].sort(() => Math.random() - 0.5);

            buildSlots();
            buildGrid();
            playCurrentSentence();
        }

        function buildSlots() {
            const container = document.getElementById('target-slots');
            container.innerHTML = '';
            targetChars.forEach((_, i) => {
                const slot = document.createElement('div');
                slot.className = 'slot-box';
                slot.id = `slot-${i}`;
                container.appendChild(slot);
            });
        }

        function buildGrid() {
            const container = document.getElementById('grid-container');
            container.innerHTML = '';

            shuffledChars.forEach((char, index) => {
                const tile = document.createElement('div');
                tile.className = 'grid-tile';
                tile.innerText = char;
                tile.id = `tile-${index}`;
                tile.onclick = () => handleTileClick(char, tile);
                container.appendChild(tile);
            });
        }

        function playCurrentSentence() {
            if (!gameActive) return;
            const sentenceStr = gamePassages[currentSentenceIndex];
            document.getElementById('feedback').innerText = '請聼句子，按順序選出正確的字！';
            speak(sentenceStr);
        }

        function repeatSentence() {
            if (!gameActive) return;
            speak(gamePassages[currentSentenceIndex]);
        }

        function resetCurrentSentence() {
            if (!gameActive) return;
            playerProgressIndex = 0;
            buildSlots();
            const tiles = document.querySelectorAll('.grid-tile');
            tiles.forEach(t => t.classList.remove('used'));
            document.getElementById('feedback').innerText = '已重設，請重新選字！';
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-HK';
                utterance.rate = 0.8;
                window.speechSynthesis.speak(utterance);
            }
        }

        function handleTileClick(selectedChar, tileElement) {
            if (!gameActive || tileElement.classList.contains('used')) return;

            const expectedChar = targetChars[playerProgressIndex];

            if (selectedChar === expectedChar) {
                const slot = document.getElementById(`slot-${playerProgressIndex}`);
                slot.innerText = selectedChar;
                slot.classList.add('filled');
                tileElement.classList.add('used');

                playerProgressIndex++;
                document.getElementById('feedback').innerText = '👍 對啦！繼續選下一個字！';

                if (playerProgressIndex >= targetChars.length) {
                    document.getElementById('feedback').innerText = '🎉 太棒了！這句完成！';
                    currentSentenceIndex++;
                    setTimeout(loadSentence, 1500);
                }
            } else {
                lives--;
                updatePandas(); // Turns one of the randomly scattered pandas into stone.png!
                document.getElementById('feedback').innerText = '❌ 哎呀！一隻熊貓變石頭了，再聽一次！';
                
                if (lives <= 0) {
                    gameActive = false;
                    document.getElementById('feedback').innerText = '😢 熊貓都變成石頭了！再試一次吧！';
                    speak('熊貓都變成石頭了！再試一次吧！');
                } else {
                    setTimeout(repeatSentence, 800);
                }
            }
        }
    </script>
</body>
</html>
