<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>漢字聼音砌字大冒險</title>
    <!-- Matter.js Physics Engine CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script src="passage1.js"></script>
    <script src="passage2.js"></script>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background-color: #f0f7f4;
            color: #333;
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .main-layout {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            justify-content: center;
            gap: 20px;
            max-width: 960px;
            width: 100%;
            box-sizing: border-box;
        }

        .game-container {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            padding: 30px;
            max-width: 680px;
            width: 100%;
            border: 4px solid #b4e197;
            box-sizing: border-box;
            position: relative;
        }

        .jar-sidebar {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
            padding: 20px 15px;
            width: 280px;
            border: 4px solid #ffcc80;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
        }

        h1 {
            color: #5c8374;
            font-size: 26px;
            margin-bottom: 10px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f9fbf9;
            border: 2px solid #b4e197;
            border-radius: 12px;
            padding: 8px 15px;
            margin-bottom: 15px;
        }

        .level-selector select {
            font-size: 15px;
            padding: 5px 10px;
            border-radius: 8px;
            border: 1px solid #b4e197;
            background: #fff;
            color: #333;
            cursor: pointer;
        }

        .parent-btn {
            background-color: #a0c4ff;
            color: #333;
            padding: 6px 14px;
            font-size: 14px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            box-shadow: 0 3px #70a9ff;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            font-size: 16px;
            font-weight: bold;
            margin: 15px 0;
            color: #5c8374;
            background: #f9fbf9;
            padding: 10px;
            border-radius: 14px;
            border: 2px dashed #d8e2dc;
        }

        .basket-header {
            font-size: 14px;
            font-weight: bold;
            color: #e65100;
            margin-bottom: 10px;
            text-align: center;
        }

        .clear-candies-btn {
            background-color: #ff7675;
            color: white;
            border: none;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            margin-bottom: 10px;
            box-shadow: 0 2px #d63031;
        }

        .clear-candies-btn:active {
            transform: translateY(1px);
        }

        .container-wrapper {
            position: relative;
            width: 220px;
            height: 380px;
            margin: 0 auto;
            border-radius: 16px;
            overflow: hidden;
            background-color: #fffdf9;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
            border: 3px solid #ffb7b2;
        }

        #candy-canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #sentence-display {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 15px 0;
            font-size: 32px;
            font-weight: bold;
            min-height: 50px;
            align-items: center;
        }

        .highlight-word {
            padding: 2px 8px;
            border-radius: 8px;
            background-color: transparent;
            color: #5c8374;
            display: inline-block;
        }

        .highlight-word.active {
            background-color: #ffeb3b;
            color: #d63031;
            box-shadow: 0 0 10px rgba(255, 235, 59, 0.8);
        }

        #target-slots {
            display: flex;
            gap: 10px;
            justify-content: center;
            min-height: 75px;
            margin: 15px 0;
            background: #fffdf9;
            border: 3px dashed #d8e2dc;
            border-radius: 16px;
            padding: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .slot-box {
            width: 52px;
            height: 52px;
            background-color: #f0f7f4;
            border: 2px solid #b4e197;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            color: #5c8374;
        }

        .slot-box.filled {
            background-color: #b5ead7;
            border-color: #90cdbc;
        }

        .slot-box.drag-over {
            background-color: #ffeaa7;
            border-color: #fdcb6e;
        }

        #grid-container {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 20px auto;
            justify-content: center;
        }

        .grid-tile {
            background-color: #ffb7b2;
            color: white;
            font-size: 30px;
            font-weight: bold;
            height: 65px;
            width: 65px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
            box-shadow: 0 4px #ff9aa2;
            user-select: none;
            touch-action: none;
            transition: transform 0.2s ease;
        }

        .grid-tile:active {
            cursor: grabbing;
        }

        .grid-tile.used {
            background-color: #e0e0e0 !important;
            box-shadow: 0 4px #ccc !important;
            color: #999;
            cursor: not-allowed;
            pointer-events: none;
            opacity: 0.5;
        }

        .grid-tile.glow {
            animation: pulseGlow 0.8s infinite alternate;
            border: 4px solid #ffeb3b;
        }

        @keyframes pulseGlow {
            from { box-shadow: 0 0 8px #ffeb3b, 0 0 15px #ffeb3b; }
            to { box-shadow: 0 0 20px #ff9800, 0 0 35px #ff9800; }
        }

        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 20px;
        }

        button {
            background-color: #ffb7b2;
            border: none;
            color: white;
            padding: 10px 22px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px #ff9aa2;
        }

        button:active {
            transform: translateY(2px);
        }

        button.secondary {
            background-color: #b5ead7;
            color: #333;
            box-shadow: 0 4px #c7ceea;
        }

        button.hint-btn {
            background-color: #ffeaa7;
            color: #d63031;
            box-shadow: 0 4px #fdcb6e;
        }

        #feedback {
            font-size: 19px;
            font-weight: bold;
            height: 35px;
            margin-top: 10px;
            color: #ff9aa2;
        }

        #parent-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #fff;
            padding: 25px;
            border-radius: 20px;
            width: 90%;
            max-width: 500px;
            border: 4px solid #5c8374;
            text-align: left;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-content h2 { color: #5c8374; margin-top: 0; }
        .log-entry {
            background: #f9fbf9;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid #d8e2dc;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="main-layout">
        <div class="game-container">
            <h1>🎧 漢字聼音砌字大冒險</h1>

            <div class="top-bar">
                <div class="level-selector">
                    🎯 選擇關卡：
                    <select id="level-select" onchange="manualSelectLevel()">
                        <option value="1">Level 1</option>
                        <option value="2">Level 2</option>
                    </select>
                </div>
                <button class="parent-btn" onclick="openParentPortal()">🔒 家長專區</button>
            </div>

            <div class="stats-bar">
                <div>🟢 正確: <span id="stat-correct">0</span></div>
                <div>🔴 錯誤: <span id="stat-wrong">0</span></div>
                <div>🪙 金幣: <span id="stat-coins">0</span></div>
                <div>🍬 糖果: <span id="stat-sweets">0</span></div>
            </div>

            <div id="sentence-display"></div>

            <div id="feedback">載入中...</div>

            <div id="target-slots"></div>
            <div id="grid-container"></div>

            <div class="btn-group">
                <button class="secondary" onclick="playSentenceWithHighlight()">🔊 再聼一次示範</button>
                <button class="hint-btn" onclick="requestHint()">💡 提示</button>
                <button onclick="resetCurrentSentence()">🔄 重設此句</button>
            </div>
        </div>

        <div class="jar-sidebar">
            <div class="basket-header">🍬 糖果罐<br>(已完成句子: <span id="stat-sentences">0</span>)</div>
            <button class="clear-candies-btn" onclick="clearAllCandies()">🗑️ 清空糖果</button>
            <div class="container-wrapper">
                <canvas id="candy-canvas" width="140" height="380"></canvas>
                <img src="container.png" alt="Jar" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 10; pointer-events: none; mix-blend-mode: multiply;">
            </div>
        </div>
    </div>

    <div id="parent-modal">
        <div class="modal-content">
            <h2>🔒 家長學習記錄專區</h2>
            <div id="parent-body">
                <p>請輸入家長密碼 (預設: 1234)：</p>
                <input type="password" id="parent-pin" style="padding: 6px; font-size: 16px; width: 120px;" placeholder="PIN">
                <button onclick="verifyPin()" style="padding: 6px 14px; font-size: 14px;">確認</button>
                <div id="pin-error" style="color: red; font-size: 13px; margin-top: 5px;"></div>
            </div>
        </div>
    </div>

    <script>
        const CANDY_CONFIG = {
            jarWidth: 200,
            scale: 0.05,         
            bodyWidth: 30,       
            bodyHeight: 30,      
            restitution: 0.9,    
            friction: 0.8        
        };

        let physicsEngine, physicsRender, physicsRunner;
        let candyImages = [
            'candy_bow_2.png',
            'candy_bow_8.png',
            'candy_bow_9.png',
            'candy_bow_15.png'
        ];

        function initPhysicsJar() {
            const { Engine, Render, Runner, Bodies, Composite } = Matter;

            physicsEngine = Engine.create();
            physicsEngine.world.gravity.y = 2.5; 

            const canvas = document.getElementById('candy-canvas');
            canvas.width = CANDY_CONFIG.jarWidth;
            canvas.height = 380;

            physicsRender = Render.create({
                canvas: canvas,
                engine: physicsEngine,
                options: {
                    width: CANDY_CONFIG.jarWidth,
                    height: 380,
                    wireframes: false,
                    background: 'transparent'
                }
            });

            Render.run(physicsRender);
            physicsRunner = Runner.create();
            Runner.run(physicsRunner, physicsEngine);

            const halfW = CANDY_CONFIG.jarWidth / 2;
            const ground = Bodies.rectangle(halfW, 400, CANDY_CONFIG.jarWidth + 20, 40, { isStatic: true, render: { visible: false } });
            const leftWall = Bodies.rectangle(-10, 190, 20, 400, { isStatic: true, render: { visible: false } });
            const rightWall = Bodies.rectangle(CANDY_CONFIG.jarWidth + 10, 190, 20, 400, { isStatic: true, render: { visible: false } });
            Composite.add(physicsEngine.world, [ground, leftWall, rightWall]);
        }

        function clearAllCandies() {
            if (!physicsEngine) return;
            const allBodies = Matter.Composite.allBodies(physicsEngine.world);
            const nonStaticBodies = allBodies.filter(body => !body.isStatic);
            Matter.Composite.remove(physicsEngine.world, nonStaticBodies);

            totalSweets = 0;
            saveSweetData();
            updateScoreboard();
        }

        function spawnPhysicsCandy() {
            const { Bodies, Composite } = Matter;
            if (!physicsEngine) return;

            const allBodies = Composite.allBodies(physicsEngine.world).filter(b => !b.isStatic);
            if (allBodies.length > 30) {
                Composite.remove(physicsEngine.world, allBodies[0]);
            }

            const randomImg = candyImages[Math.floor(Math.random() * candyImages.length)];
            const startX = 60 + Math.random() * 40;
            const startY = -10 - (Math.random() * 10);

            const candy = Bodies.rectangle(startX, startY, CANDY_CONFIG.bodyWidth, CANDY_CONFIG.bodyHeight, {
                restitution: CANDY_CONFIG.restitution,
                friction: CANDY_CONFIG.friction,
                angle: Math.random() * Math.PI,
                render: {
                    sprite: {
                        texture: randomImg,
                        xScale: CANDY_CONFIG.scale,
                        yScale: CANDY_CONFIG.scale
                    }
                }
            });

            Composite.add(physicsEngine.world, candy);
            playCandyClinkSound();
        }

        function loadInitialPhysicsCandies(count) {
            if (!physicsEngine) return;
            for (let i = 0; i < Math.min(count, 30); i++) {
                const { Bodies, Composite } = Matter;
                const randomImg = candyImages[i % candyImages.length];
                const x = 40 + (i * 15) % 100;
                const y = 350 - (Math.floor(i / 4) * 18);
                
                const candy = Bodies.rectangle(x, y, CANDY_CONFIG.bodyWidth, CANDY_CONFIG.bodyHeight, {
                    restitution: CANDY_CONFIG.restitution,
                    friction: CANDY_CONFIG.friction,
                    angle: Math.random() * Math.PI,
                    render: {
                        sprite: {
                            texture: randomImg,
                            xScale: CANDY_CONFIG.scale,
                            yScale: CANDY_CONFIG.scale
                        }
                    }
                });
                Composite.add(physicsEngine.world, candy);
            }
        }

        let currentPassages = [];
        let currentLevel = 1;
        let currentSentenceIndex = 0;
        let targetChars = [];
        let shuffledChars = [];
        let playerProgressIndex = 0;
        let gameActive = false;
        let userManuallySelected = false;

        let organicCorrectCount = 0; 
        let hintUsedForThisWord = false; 
        let totalWordsAttempted = 0;
        let wrongCount = 0;
        let coins = 0;
        let completedSentencesCount = 0;
        let totalSweets = 0;
        let wrongWordsThisSession = []; 

        window.onload = function() {
            initPhysicsJar();
            loadSweetData();
            loadLevel(1, false);
        };

        function loadSweetData() {
            totalSweets = parseInt(localStorage.getItem('kid_total_sweets') || '0');
            completedSentencesCount = parseInt(localStorage.getItem('kid_completed_sentences') || '0');
            updateScoreboard();
            setTimeout(() => {
                loadInitialPhysicsCandies(totalSweets);
            }, 300);
        }

        function saveSweetData() {
            localStorage.setItem('kid_total_sweets', totalSweets);
            localStorage.setItem('kid_completed_sentences', completedSentencesCount);
        }

        function playCandyClinkSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800 + Math.random() * 500, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.08);
                
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } catch(e) {}
        }

        function manualSelectLevel() {
            const selected = parseInt(document.getElementById('level-select').value);
            if (isLevelCompletedToday(selected)) {
                alert('🌟 這一關今天已經通關囉！請明天再來挑戰，或者選擇其他關卡。');
                document.getElementById('level-select').value = currentLevel; 
                return;
            }
            userManuallySelected = true;
            loadLevel(selected, true);
        }

        function isLevelCompletedToday(lvl) {
            const todayStr = new Date().toISOString().split('T')[0]; 
            const history = JSON.parse(localStorage.getItem('study_completion_history') || '[]');
            return history.some(record => record.date === todayStr && record.level === lvl);
        }

        function loadLevel(lvl, isManual) {
            if (isLevelCompletedToday(lvl)) {
                alert(`🌟 Level ${lvl} 今天已經順利通關過囉！`);
                lvl = 1;
            }

            currentLevel = lvl;
            document.getElementById('level-select').value = lvl;
            
            if (lvl === 1 && typeof passagesLevel1 !== 'undefined') {
                currentPassages = passagesLevel1;
            } else if (lvl === 2 && typeof passagesLevel2 !== 'undefined') {
                currentPassages = passagesLevel2;
            } else {
                currentPassages = ["載入失敗 - 請檢查 passage1.js / passage2.js"];
            }

            organicCorrectCount = 0;
            totalWordsAttempted = 0;
            wrongCount = 0;
            wrongWordsThisSession = [];
            updateScoreboard();

            initGame();
        }

        function initGame() {
            currentSentenceIndex = 0;
            loadSentence();
        }

        function loadSentence() {
            if (currentSentenceIndex >= currentPassages.length) {
                gameActive = false;
                let accuracy = totalWordsAttempted > 0 ? (organicCorrectCount / totalWordsAttempted) : 0;
                let rewardMsg = "";

                if (accuracy >= 0.90 && totalWordsAttempted > 0) {
                    coins += 5;
                    rewardMsg = " 🌟 準確率超過 90%，獲得 5 枚金幣！🪙";
                    saveCompletionRecord(currentLevel, currentPassages, wrongWordsThisSession);
                }

                document.getElementById('feedback').innerText = `🏆 Level ${currentLevel} 通關！` + rewardMsg;
                speakWord("太棒了！通關！");
                document.getElementById('sentence-display').innerHTML = '';
                document.getElementById('target-slots').innerHTML = '';
                document.getElementById('grid-container').innerHTML = '';
                updateScoreboard();
                return;
            }

            gameActive = true;
            playerProgressIndex = 0;
            hintUsedForThisWord = false;

            const sentenceStr = currentPassages[currentSentenceIndex];
            targetChars = sentenceStr.split('');
            shuffledChars = [...targetChars].sort(() => Math.random() - 0.5);

            buildSentenceDisplay(targetChars);
            buildSlots();
            buildGrid();
            playSentenceWithHighlight();
        }

        function buildSentenceDisplay(chars) {
            const displayContainer = document.getElementById('sentence-display');
            displayContainer.innerHTML = '';
            chars.forEach((char, index) => {
                const span = document.createElement('span');
                span.className = 'highlight-word';
                span.id = `hw-${index}`;
                span.innerText = char;
                displayContainer.appendChild(span);
            });
        }

        function playSentenceWithHighlight() {
            if (!gameActive) return;
            const sentenceStr = currentPassages[currentSentenceIndex];
            document.getElementById('feedback').innerText = '👉 現在換你了！請按順序把卡片拖拽或點擊到上方的空格！';

            try {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(sentenceStr);
                    utterance.lang = 'zh-HK';
                    utterance.rate = 0.75;

                    utterance.onboundary = function(event) {
                        if (event.name === 'word' || event.charIndex !== undefined) {
                            let charIdx = event.charIndex;
                            if (charIdx < targetChars.length) {
                                document.querySelectorAll('.highlight-word').forEach(el => el.classList.remove('active'));
                                const activeSpan = document.getElementById(`hw-${charIdx}`);
                                if (activeSpan) {
                                    activeSpan.classList.add('active');
                                }
                            }
                        }
                    };

                    utterance.onend = function() {
                        document.querySelectorAll('.highlight-word').forEach(el => el.classList.remove('active'));
                    };

                    window.speechSynthesis.speak(utterance);
                }
            } catch(e) {
                console.log("Speech synthesis bypassed");
            }
        }

        function repeatSentence() {
            playSentenceWithHighlight();
        }

        function saveCompletionRecord(lvl, passages, wrongList) {
            const todayStr = new Date().toISOString().split('T')[0];
            const passageTitle = passages[0].substring(0, 4) + '...'; 
            let history = JSON.parse(localStorage.getItem('study_completion_history') || '[]');
            if (!history.some(r => r.date === todayStr && r.level === lvl)) {
                history.push({
                    date: todayStr,
                    level: lvl,
                    preview: passageTitle,
                    wrongWords: [...new Set(wrongList)] 
                });
                localStorage.setItem('study_completion_history', JSON.stringify(history));
            }
        }

        function buildSlots() {
            const container = document.getElementById('target-slots');
            container.innerHTML = '';
            targetChars.forEach((_, i) => {
                const slot = document.createElement('div');
                slot.className = 'slot-box';
                slot.id = `slot-${i}`;

                slot.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    slot.classList.add('drag-over');
                });
                slot.addEventListener('dragleave', () => {
                    slot.classList.remove('drag-over');
                });
                slot.addEventListener('drop', (e) => {
                    e.preventDefault();
                    slot.classList.remove('drag-over');
                    const char = e.dataTransfer.getData('text/plain');
                    const tileId = e.dataTransfer.getData('tileId');
                    const tileElem = document.getElementById(tileId);
                    if (tileElem) {
                        handleCardPlacement(char, i, tileElem);
                    }
                });

                container.appendChild(slot);
            });
        }

        function buildGrid() {
            const container = document.getElementById('grid-container');
            container.innerHTML = '';

            shuffledChars.forEach((char, index) => {
                const tile = document.createElement('div');
                tile.className = 'grid-tile';
                tile.innerText = char;
                tile.id = `tile-${index}`;
                tile.draggable = true;

                tile.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', char);
                    e.dataTransfer.setData('tileId', tile.id);
                });

                tile.onclick = () => {
                    if (!gameActive || tile.classList.contains('used')) return;
                    handleCardPlacement(char, playerProgressIndex, tile);
                };

                container.appendChild(tile);
            });
        }

        function handleCardPlacement(selectedChar, slotIndex, tileElement) {
            if (!gameActive || tileElement.classList.contains('used')) return;

            const expectedChar = targetChars[playerProgressIndex];
            totalWordsAttempted++;

            if (slotIndex === playerProgressIndex && selectedChar === expectedChar) {
                document.querySelectorAll('.grid-tile').forEach(t => t.classList.remove('glow'));

                const slot = document.getElementById(`slot-${playerProgressIndex}`);
                slot.innerText = selectedChar;
                slot.classList.add('filled');
                tileElement.classList.add('used');

                document.querySelectorAll('.highlight-word').forEach(el => el.classList.remove('active'));
                const activeWord = document.getElementById(`hw-${playerProgressIndex}`);
                if (activeWord) activeWord.classList.add('active');
                speakWord(selectedChar);

                if (!hintUsedForThisWord) {
                    organicCorrectCount++;
                } else {
                    wrongCount++; 
                }

                updateScoreboard();
                playerProgressIndex++;
                hintUsedForThisWord = false; 
                document.getElementById('feedback').innerText = '👍 對啦！繼續拖拽下一個字！';

                if (playerProgressIndex >= targetChars.length) {
                    document.getElementById('feedback').innerText = '🎉 太棒了！這句完成！';
                    
                    completedSentencesCount++;
                    totalSweets += 3; 
                    saveSweetData();
                    updateScoreboard();

                    dropCandiesDirectly(3);
                }
            } else {
                wrongCount++;
                wrongWordsThisSession.push(expectedChar); 
                updateScoreboard();
                document.getElementById('feedback').innerText = '❌ 順序不對哦，點擊「提示」按鈕看看！';
                
                document.querySelectorAll('.grid-tile').forEach(tile => {
                    if (tile.innerText === expectedChar && !tile.classList.contains('used')) {
                        tile.classList.add('glow');
                    }
                });

                setTimeout(repeatSentence, 800);
            }
        }

        function dropCandiesDirectly(count) {
            let dropped = 0;
            const interval = setInterval(() => {
                if (dropped < count) {
                    spawnPhysicsCandy();
                    dropped++;
                } else {
                    clearInterval(interval);
                    setTimeout(() => {
                        currentSentenceIndex++;
                        loadSentence();
                    }, 800);
                }
            }, 300);
        }

        function resetCurrentSentence() {
            if (!gameActive) return;
            playerProgressIndex = 0;
            hintUsedForThisWord = false;
            buildSlots();
            document.querySelectorAll('.grid-tile').forEach(t => {
                t.classList.remove('used', 'glow');
            });
            document.getElementById('feedback').innerText = '已重設，請重新配對！';
        }

        function requestHint() {
            if (!gameActive) return;
            hintUsedForThisWord = true; 
            const expectedChar = targetChars[playerProgressIndex];
            wrongWordsThisSession.push(expectedChar); 

            document.querySelectorAll('.grid-tile').forEach(tile => {
                if (tile.innerText === expectedChar && !tile.classList.contains('used')) {
                    tile.classList.add('glow');
                }
            });
            document.getElementById('feedback').innerText = '💡 提示：發光的字就是下一個正確的字！';
        }

        function speakWord(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-HK';
                utterance.rate = 0.8;
                window.speechSynthesis.speak(utterance);
            }
        }

        function updateScoreboard() {
            document.getElementById('stat-correct').innerText = organicCorrectCount;
            document.getElementById('stat-wrong').innerText = wrongCount;
            document.getElementById('stat-coins').innerText = coins;
            document.getElementById('stat-sweets').innerText = totalSweets;
            document.getElementById('stat-sentences').innerText = completedSentencesCount;
        }

        function openParentPortal() {
            document.getElementById('parent-modal').style.display = 'flex';
            document.getElementById('parent-pin').value = '';
            document.getElementById('pin-error').innerText = '';
            document.getElementById('parent-body').innerHTML = `
                <p>請輸入家長密碼 (預設: 1234)：</p>
                <input type="password" id="parent-pin" style="padding: 6px; font-size: 16px; width: 120px;" placeholder="PIN">
                <button onclick="verifyPin()" style="padding: 6px 14px; font-size: 14px;">確認</button>
                <div id="pin-error" style="color: red; font-size: 13px; margin-top: 5px;"></div>
                <br><button onclick="closeParentPortal()" style="background:#ccc; margin-top:10px; padding:4px 10px; font-size:13px;">關閉</button>
            `;
        }

        function closeParentPortal() {
            document.getElementById('parent-modal').style.display = 'none';
        }

        function verifyPin() {
            const pin = document.getElementById('parent-pin').value;
            if (pin === '1234') {
                renderParentDashboard();
            } else {
                document.getElementById('pin-error').innerText = '❌ 密碼錯誤！';
            }
        }

        function renderParentDashboard() {
            const history = JSON.parse(localStorage.getItem('study_completion_history') || '[]');
            
            let html = `<h3>📊 學習日誌報表</h3>`;
            html += `<p><b>🍬 總獲得糖果數：</b> ${totalSweets} 顆</p>`;
            if (history.length === 0) {
                html += `<p>暫無通關記錄。完成 Level 並獲得 90% 以上正確率即可記錄。</p>`;
            } else {
                history.forEach(item => {
                    html += `
                        <div class="log-entry">
                            <b>📅 日期：</b> ${item.date}<br>
                            <b>🎯 關卡：</b> Level ${item.level} (預覽: ${item.preview})<br>
                            <b>🔴 需要加強的字：</b> ${item.wrongWords.length > 0 ? item.wrongWords.join(', ') : '無 (全部完美答對！)'}
                        </div>
                    `;
                });
            }

            html += `
                <div style="margin-top: 15px; display: flex; gap: 10px;">
                    <button onclick="clearHistory()" style="background-color:#ff7675; padding: 6px 12px; font-size: 13px;">清除記錄</button>
                    <button onclick="closeParentPortal()" style="background-color:#b5ead7; color:#333; padding: 6px 12px; font-size: 13px;">關閉</button>
                </div>
            `;
            document.getElementById('parent-body').innerHTML = html;
        }

        function clearHistory() {
            if (confirm('確定要清除所有學習記錄與糖果數嗎？')) {
                localStorage.removeItem('study_completion_history');
                localStorage.removeItem('kid_total_sweets');
                localStorage.removeItem('kid_completed_sentences');
                totalSweets = 0;
                completedSentencesCount = 0;
                updateScoreboard();
                renderParentDashboard();
            }
        }
    </script>
</body>
</html>
